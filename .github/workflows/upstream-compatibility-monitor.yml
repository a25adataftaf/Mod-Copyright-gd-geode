name: Upstream Compatibility Monitor

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    name: Check Geode, Jukebox & NodeIDs Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Query upstream tags and publish compatibility summary
        run: |
          python scripts/check_upstream_compatibility.py --live | tee -a "$GITHUB_STEP_SUMMARY"
