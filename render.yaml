# One-click Render.com Blueprint for deploying the optional centralized
# Music Rights Checker FastAPI + AI + Shared Cache Backend.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mrc-rights-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: MRC_ENVIRONMENT
        value: production
      - key: MRC_DATABASE_URL
        value: sqlite+aiosqlite:////tmp/mrc_rights.db
      - key: MRC_ADMIN_API_TOKEN
        generateValue: true
      - key: MRC_AI_PROVIDER
        value: none
      - key: MRC_AI_DAILY_BUDGET_CALLS
        value: "250"
      - key: MRC_ENABLE_EXTERNAL_FETCH
        value: "true"
